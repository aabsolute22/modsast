# Internal helper: dumps public API signatures of the Minecraft classes the mod uses.
# Runs only when files under .github/probe change.
name: probe
on:
  push:
    paths:
      - '.github/probe/**'
      - '.github/workflows/probe.yml'

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - run: ./gradlew compileJava --no-configuration-cache
      - run: bash .github/probe/probe.sh
