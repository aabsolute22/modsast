name: build
on:
  push:
    paths-ignore: ['**.md', 'seedcracker/**', '.github/probe/**', '.github/workflows/probe.yml', '.github/workflows/seedcracker.yml']
  pull_request:
    paths-ignore: ['**.md', 'seedcracker/**', '.github/probe/**', '.github/workflows/probe.yml', '.github/workflows/seedcracker.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: endcityfinder
          path: build/libs/

  client-gametest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: install graphics stack
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers xvfb imagemagick
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: run client game test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest --stacktrace
      - name: print screenshots
        if: always()
        run: |
          for f in $(find build/run -name '*ecf_*.png' | sort); do
            convert "$f" -resize 1000x -quality 75 /tmp/shot.jpg || cp "$f" /tmp/shot.jpg
            echo "=== SCREENSHOT $(basename "$f") ==="
            base64 -w0 /tmp/shot.jpg
            echo
            echo "=== END ==="
          done
