name: seedcracker
on:
  push:
    paths: ['seedcracker/**', '.github/workflows/seedcracker.yml']
  pull_request:
    paths: ['seedcracker/**', '.github/workflows/seedcracker.yml']

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and test
        run: ./gradlew -p seedcracker build --stacktrace
      - name: capture build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seedcracker
          path: seedcracker/build/libs/
